<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#071226" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Filters for Dynamic Glow & Pulse -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shieldGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Keyframe Animations for Dynamic Aspect */
    @keyframes pulseScan {
      0% { transform: translateY(-100px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(300px); opacity: 0.2; }
    }
    @keyframes floatShield {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -100; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 6px; opacity: 0.6; }
      50% { r: 9px; opacity: 1; }
    }

    .animated-shield {
      animation: floatShield 4s ease-in-out infinite;
    }
    .scan-line {
      animation: pulseScan 6s linear infinite;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dashLine 3s linear infinite;
    }
    .pulsing-node {
      animation: nodePulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="260" r="200" fill="#a855f7" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Network Connection Nodes (Left Side Background) -->
  <g stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5">
    <line x1="120" y1="90" x2="220" y2="170" class="flow-line" />
    <line x1="220" y1="170" x2="160" y2="260" />
    <line x1="220" y1="170" x2="340" y2="130" class="flow-line" />
    <line x1="340" y1="130" x2="280" y2="250" />
  </g>
  <circle cx="120" cy="90" r="5" fill="#6366f1" />
  <circle cx="220" cy="170" r="7" fill="#a855f7" class="pulsing-node" />
  <circle cx="160" cy="260" r="5" fill="#ec4899" />
  <circle cx="340" cy="130" r="6" fill="#00f2fe" />
  <circle cx="280" cy="250" r="4" fill="#6366f1" />

  <!-- Dynamic Network Nodes (Right Side Background) -->
  <g stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5">
    <line x1="880" y1="80" x2="980" y2="160" class="flow-line" />
    <line x1="980" y1="160" x2="1080" y2="100" />
    <line x1="980" y1="160" x2="920" y2="260" class="flow-line" />
    <line x1="920" y1="260" x2="1040" y2="250" />
  </g>
  <circle cx="880" cy="80" r="5" fill="#00f2fe" />
  <circle cx="980" cy="160" r="8" fill="#6366f1" class="pulsing-node" />
  <circle cx="1080" cy="100" r="4" fill="#a855f7" />
  <circle cx="920" cy="260" r="6" fill="#ec4899" />
  <circle cx="1040" cy="250" r="5" fill="#38bdf8" />

  <!-- Shield Icon (Center / Main Graphic) -->
  <g transform="translate(180, 75)" class="animated-shield" filter="url(#shieldGlow)">
    <!-- Outer Shield -->
    <path d="M 90 20 L 160 50 C 160 130 120 180 90 200 C 60 180 20 130 20 50 Z" 
          fill="none" stroke="url(#primaryGlow)" stroke-width="4" />
    <!-- Inner Filled Shield -->
    <path d="M 90 32 L 148 58 C 148 124 114 166 90 184 C 66 166 32 124 32 58 Z" 
          fill="rgba(15, 23, 42, 0.75)" stroke="url(#cyanGlow)" stroke-width="2" />
    
    <!-- Lock & Graph Core Icon -->
    <path d="M 90 70 L 115 85 L 115 115 L 90 130 L 65 115 L 65 85 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="90" cy="100" r="8" fill="url(#primaryGlow)" />
    <path d="M 90 108 L 90 122" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Animated Scanner Line Effect Over Shield -->
  <g transform="translate(180, 60)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.6" class="scan-line" />
  </g>

  <!-- Typography Content -->
  <!-- Category Pill Badge -->
  <g transform="translate(420, 72)">
    <rect width="260" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="34" y="21" class="badge-text">CURATED RESEARCH &amp; STACK</text>
  </g>

  <!-- Title -->
  <text x="420" y="152" class="title">Awesome Fraud Analytics 🛡️</text>

  <!-- Subtitle / Tagline -->
  <text x="420" y="194" class="subtitle">Open-source &amp; commercial platforms for real-time risk scoring,</text>
  <text x="420" y="222" class="subtitle">behavioral AI, network intelligence &amp; financial crime prevention.</text>

  <!-- Bottom Metric Highlights -->
  <g transform="translate(420, 260)">
    <rect x="0" y="0" width="160" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="14" y="22" font-family="sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">🤖 Machine Learning</text>

    <rect x="175" y="0" width="160" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="189" y="22" font-family="sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">⚡ Real-time Rules</text>

    <rect x="350" y="0" width="160" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="364" y="22" font-family="sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">🕸️ Graph Analytics</text>
  </g>
</svg>
